name: Production truth gates

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: production-truth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-reviewed-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.env.local.example
            /.github/workflows/quality.yml
            /__tests__/
            /api/
            /ecosystem/
            /images/
            /nft/wisdom-drops/
            /scripts/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Verify provenance matches the checked-out revision
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node -e "const p=require('./dist/deployment-provenance.json'); if(p.commit!==process.env.EXPECTED_COMMIT) process.exit(1)"

name: Production truth gates

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: production-truth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-reviewed-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.env.local.example
            /__tests__/
            /api/
            /ecosystem/
            /images/
            /nft/wisdom-drops/
            /scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Verify provenance matches the checked-out revision
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node -e "const p=require('./dist/deployment-provenance.json'); if(p.commit!==process.env.EXPECTED_COMMIT) process.exit(1)"
